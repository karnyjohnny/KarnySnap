name: Build KarnySnap (Windows, x86 + x64)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86
            msystem: MINGW32
            prefix: mingw-w64-i686
            gcc_pkg: mingw-w64-i686-gcc
            gdiplus_pkg: mingw-w64-i686-libgdiplus
            out: KarnySnap_x86.exe
          - arch: x64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
            gcc_pkg: mingw-w64-x86_64-gcc
            gdiplus_pkg: mingw-w64-x86_64-libgdiplus
            out: KarnySnap_x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.gcc_pkg }}
            mingw-w64-cross-binutils
            make

      - name: Build KarnySnap.exe
        shell: msys2 {0}
        run: |
          set -e
          gcc -std=c23 -O2 -march=core2 -msse3 -mfpmath=sse -mwindows \
              -Wall -Wextra \
              src/karnysnap.c -o "${{ matrix.out }}" \
              -lgdiplus -lshell32 -lole32 -lcomdlg32

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarnySnap-${{ matrix.arch }}
          path: ${{ matrix.out }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KarnySnap-x86/KarnySnap_x86.exe
            dist/KarnySnap-x64/KarnySnap_x64.exe
          generate_release_notes: true
